"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Aha! — Your private agent<\u002Ftitle>\n<script src=\"6c53902d-bb36-426e-9fc1-d5ef2d255b8d\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1440\"><meta name=\"hz:canvas-height\" content=\"7400\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800;900&amp;display=swap\">\n<style>\nbody{margin:0}\n.light{--bg:#FAF8F4;--ink:#1D1D1B;--muted:#55534E;--card:#FFFFFF;--line:#E6E0D4;--soft:#F3EDE2;--grey:#ECEAE6;--greyInk:#5F5D58;--accent:#E8A33D;--accentSoft:#FBEBD0}\n.dark{--bg:#151412;--ink:#F4F1EA;--muted:#B8B3A9;--card:#211F1C;--line:#37332D;--soft:#1C1A17;--grey:#2B2926;--greyInk:#ADA89E;--accent:#E8A33D;--accentSoft:#3A2C17}\na{color:var(--ink)}a:hover{color:#B7771B}\n.e2e-flow{stroke-dasharray:1 17;animation:e2eflow 1.4s linear infinite}\n@keyframes e2eflow{to{stroke-dashoffset:-36}}\n@media (prefers-reduced-motion: reduce){.e2e-flow{animation:none}}\n.diag-tall{display:none}\n@media (max-width: 760px){.diag-wide{display:none}.diag-tall{display:block;max-width:380px;margin:0 auto}}\n@media (max-width: 760px){p,li,td,dd,dt{font-size:17px !important;line-height:1.55 !important}h1{font-size:44px !important}h2{font-size:32px !important}h3{font-size:20px !important}th{font-size:12px !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"{{theme}}\" style=\"background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 18px; line-height: 1.6; min-height: 100vh\" data-canvas-width=\"1440\" data-canvas-height=\"7400\" data-document-role=\"page\" data-label=\"Landing page\">\n\n<!-- NAV -->\n<header style=\"border-bottom: 1px solid var(--line)\">\n<nav style=\"max-width: 1180px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" aria-label=\"aha home\" style=\"display: flex; align-items: flex-end; text-decoration: none; color: var(--ink); font-weight: 900; font-size: 30px; letter-spacing: -0.5px; line-height: 1\">\n<span>ah<\u002Fspan><span style=\"position: relative; display: inline-block\">a<span aria-hidden=\"true\" style=\"position: absolute; left: 50%; top: -9px; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: var(--accent)\"><\u002Fspan><\u002Fspan>\n<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 24px; font-size: 16px; font-weight: 600\">\n<a href=\"#features\" style=\"text-decoration: none\">Features<\u002Fa>\n<a href=\"#how\" style=\"text-decoration: none\">How it works<\u002Fa>\n<a href=\"#security\" style=\"text-decoration: none\">Security<\u002Fa>\n<a href=\"#pricing\" style=\"text-decoration: none\">Pricing<\u002Fa>\n<a href=\"#faq\" style=\"text-decoration: none\">FAQ<\u002Fa>\n<a href=\"#install\" style=\"text-decoration: none; background: var(--accent); color: #1D1D1B; padding: 10px 18px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Install<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" style=\"max-width: 1180px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 56px\">\n<div style=\"flex: 999 1 460px; min-width: 0; padding-top: 48px\">\n<p style=\"margin: 0 0 18px; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted)\">Local AI agent<\u002Fp>\n<h1 style=\"margin: 0; font-size: 68px; line-height: 1.02; font-weight: 900; letter-spacing: -1.5px\">{{headline}}<\u002Fh1>\n<p style=\"margin: 24px 0 0; font-size: 22px; line-height: 1.5; color: var(--muted); max-width: 520px\">An AI agent on your Linux computer for research, bookings and other tasks. You use it from your phone, end-to-end encrypted.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px\">\n<a href=\"#install\" style=\"text-decoration: none; background: var(--accent); color: #1D1D1B; font-weight: 800; font-size: 18px; padding: 14px 28px; border-radius: 999px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Install<\u002Fa>\n<a href=\"#chat\" style=\"text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); font-weight: 700; font-size: 18px; padding: 14px 26px; border-radius: 999px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">How it works<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 28px 0 0; font-size: 15px; color: var(--muted)\">AGPL-3.0. Requires Linux, an NVIDIA GPU with 16 GB of VRAM and 32 GB of RAM.<\u002Fp>\n<\u002Fdiv>\n\n<!-- APP: main conversation -->\n<div id=\"chat\" style=\"flex: 1 1 380px; display: flex; justify-content: center; min-width: 0\">\n<div style=\"width: 380px; max-width: 100%; border-radius: 44px; background: #1D1D1B; padding: 12px; box-shadow: 0 30px 60px -20px rgba(29,29,27,0.35)\">\n<div style=\"border-radius: 34px; overflow: hidden; background: var(--bg); font-size: 14px; line-height: 1.45; color: var(--ink); display: flex; flex-direction: column\">\n<div style=\"padding: 14px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n<div style=\"display: flex; align-items: flex-end; font-weight: 900; font-size: 20px; letter-spacing: -0.3px; line-height: 1\"><span>ah<\u002Fspan><span style=\"position: relative; display: inline-block\">a<span aria-hidden=\"true\" style=\"position: absolute; left: 50%; top: -6px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--accent)\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25\">\n<span style=\"font-size: 12px; font-weight: 700\"><span aria-hidden=\"true\" style=\"display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3FA34D; margin-right: 5px\"><\u002Fspan>Home · online<\u002Fspan>\n<span style=\"font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px\"><svg aria-hidden=\"true\" width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V7a4 4 0 018 0v4\"><\u002Fpath><\u002Fsvg>End-to-end encrypted<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px\">\n\n<div style=\"align-self: flex-end; max-width: 82%; background: var(--soft); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 8px 12px\">btw my wife is vegetarian, keep that in mind for bookings<\u002Fdiv>\n\n<div style=\"border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px\">\n<div><strong>🧠 Remember this?<\u002Fstrong> <em>Wife is vegetarian; prefer places with good vegetarian options.<\u002Fem><\u002Fdiv>\n<div style=\"font-size: 12px; font-weight: 700; color: var(--muted)\">✓ Saved<\u002Fdiv>\n<\u002Fdiv>\n\n<div>Noted. I'll favour places with good vegetarian options.<\u002Fdiv>\n\n<div style=\"align-self: flex-end; max-width: 82%; background: var(--soft); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 8px 12px\">Book Flat Iron in Kings Cross for 2 next Friday at 2pm<\u002Fdiv>\n\n<div style=\"display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px\"><span aria-hidden=\"true\" style= \n<rect x=\"12\" y=\"761\" width=\"266\" height=\"96\" rx=\"14\" fill=\"none\" stroke-dasharray=\"5 5\" style=\"stroke: var(--accent); stroke-width: 1.6\"><\u002Frect>\n<rect x=\"24\" y=\"850\" width=\"198\" height=\"14\" style=\"fill: var(--accentSoft)\"><\u002Frect>\n<text x=\"30\" y=\"861\" style=\"fill: var(--ink); font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px\">AHA! HARNESS · OPEN SOURCE<\u002Ftext>\n<rect x=\"22\" y=\"770\" width=\"118\" height=\"32\" rx=\"16\" style=\"fill: var(--card); stroke: var(--line)\"><\u002Frect>\n<text x=\"81\" y=\"791\" text-anchor=\"middle\" style=\"fill: var(--ink); font-size: 14px; font-weight: 700\">Model<\u002Ftext>\n<rect x=\"150\" y=\"770\" width=\"118\" height=\"32\" rx=\"16\" style=\"fill: var(--card); stroke: var(--line)\"><\u002Frect>\n<text x=\"209\" y=\"791\" text-anchor=\"middle\" style=\"fill: var(--ink); font-size: 14px; font-weight: 700\">Memories<\u002Ftext>\n<rect x=\"22\" y=\"812\" width=\"118\" height=\"32\" rx=\"16\" style=\"fill: var(--card); stroke: var(--line)\"><\u002Frect>\n<text x=\"81\" y=\"833\" text-anchor=\"middle\" style=\"fill: var(--ink); font-size: 14px; font-weight: 700\">Documents<\u002Ftext>\n<rect x=\"150\" y=\"812\" width=\"118\" height=\"32\" rx=\"16\" style=\"fill: var(--card); stroke: var(--line)\"><\u002Frect>\n<text x=\"209\" y=\"833\" text-anchor=\"middle\" style=\"fill: var(--ink); font-size: 14px; font-weight: 700\">History<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<\u002Ffigure>\n<\u002Fsection>\n\n<!-- HOUSEHOLD, APP, HARDWARE -->\n<section style=\"max-width: 1180px; margin: 0 auto; padding: 48px 24px 96px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 240px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); padding: 36px; display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 32px; line-height: 1.15; font-weight: 900\">Several people per computer<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">Separate accounts, conversations and memories.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 240px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); padding: 36px; display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 32px; line-height: 1.15; font-weight: 900\">The app<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">One conversation, approval cards, no tracking. Light and dark, six colours.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 240px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); padding: 36px; display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 32px; line-height: 1.15; font-weight: 900\">Running costs<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">It runs on your GPU: no per-token charges.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SECURITY -->\n<section id=\"security\" style=\"border-top: 1px solid var(--line)\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 80px 24px\">\n<h2 style=\"margin: 0 0 10px; font-size: 44px; line-height: 1.1; font-weight: 900; letter-spacing: -0.5px\">Security<\u002Fh2>\n<p style=\"margin: 0 0 32px; color: var(--muted); font-size: 17px\">Source: <a href=\"https://github.com/axxlabs/aha-local-llm\">aha-local-llm<\u002Fa> · <a href=\"https://github.com/axxlabs/aha-app\">aha-app<\u002Fa> · <a href=\"https://github.com/axxlabs/aha-gateway\">aha-gateway<\u002Fa><\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 1 1 320px; background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--ok, #3FA34D); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 800\">Protocols<\u002Fh3>\n<ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.5\">\n<li style=\"margin: 0 0 9px\"><b>Pairing:<\u002Fb> X25519 + ML-KEM-768, bound to a 32-byte secret in the QR code (URL fragment, never sent to a server).<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Messages:<\u002Fb> Double Ratchet with ML-KEM in each step; ChaCha20-Poly1305; padded to 256 bytes.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Keys:<\u002Fb> Ed25519 identities. The gateway key is pinned, and the gateway signs a fresh nonce from each side.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Certificates:<\u002Fb> Route only. Signed only for a just-paired device or a renewal.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Transport:<\u002Fb> WebSocket over TLS 1.3. No database, no message logs.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Push:<\u002Fb> RFC 8291 + VAPID, sealed again per device; fixed notification text.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Phone storage:<\u002Fb> AES-256-GCM, non-extractable key.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Code:<\u002Fb> <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">pyca/cryptography<\u002Fcode>, <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">@noble/*<\u002Fcode>; cross-language test vectors, fuzzing; images pinned by digest.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 800\">Airlocks<\u002Fh3>\n<ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.5\">\n<li style=\"margin: 0 0 9px\"><b><code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">aha-llm<\u002Fcode>:<\u002Fb> llama.cpp, Qwen3.6-35B-A3B. No network, read-only, no capabilities.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b><code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">aha-agent<\u002Fcode>:<\u002Fb> the harness, the only bridge to the web. Read-only, no capabilities.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b><code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">fetch_url<\u002Fcode>:<\u002Fb> http(s) only; private addresses, local names and non-public DNS answers blocked.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b><code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">aha-browser<\u002Fcode>:<\u002Fb> pinned Chromium, in-memory profile, cut off from the other containers.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Policy:<\u002Fb> typing, forms and memory changes need approval; JavaScript evaluation and uploads blocked.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>App:<\u002Fb> separate server, strict CSP, HSTS, file hashes at <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">/release.txt<\u002Fcode>.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; background: var(--card); border: 1px solid var(--line); border-top: 5px solid #B54708; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 800\">Not audited yet<\u002Fh3>\n<ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.5\">\n<li style=\"margin: 0 0 9px\"><b>AHA-PQ v1<\u002Fb> has no external review yet.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Web app code<\u002Fb> is trusted on each load until signed releases.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>ML-KEM keys<\u002Fb> don't rotate yet.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>The gateway sees<\u002Fb> keys, connection times, IP addresses and sizes.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Navigation<\u002Fb> is automatic by default; a malicious page could leak data in a URL. Set <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">allow_all_sites = false<\u002Fcode> to approve each site.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b><code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 5px\">aha-browser<\u002Fcode><\u002Fb> keeps Chromium's capabilities and has internet access.<\u002Fli>\n<li style=\"margin: 0 0 9px\"><b>Your computer<\u002Fb> is the root of trust.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PRICING -->\n<section id=\"pricing\" style=\"background: var(--soft); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line)\">\n<div style=\"max-width: 1000px; margin: 0 auto; padding: 88px 24px\">\n<h2 style=\"margin: 0 0 40px; font-size: 44px; line-height: 1.1; font-weight: 900; letter-spacing: -0.5px; text-align: center\">Gateway pricing<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch\">\n<div style=\"flex: 1 1 360px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 36px; display: flex; flex-direction: column; gap: 18px\">\n<div>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 800\">Self-hosted<\u002Fh3>\n<div style=\"margin-top: 8px; font-size: 44px; font-weight: 900; line-height: 1\">Free<\u002Fdiv>\n<div style=\"margin-top: 6px; color: var(--muted); font-size: 16px\">Open source<\u002Fdiv>\n<\u002Fdiv>\n<dl style=\"margin: 0; display: flex; flex-direction: column; gap: 14px; font-size: 16px\">\n<div><dt style=\"font-weight: 700\">You run<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">The agent and a gateway (server, domain, TLS)<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-weight: 700\">Messages<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">Unlimited<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-weight: 700\">Data<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">On your computer<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-weight: 700\">Updates<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">Yours<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<p style=\"margin: auto 0 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted)\">Not supported by Axxlabs.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; background: var(--card); border: 2px solid var(--accent); border-radius: 22px; padding: 36px; display: flex; flex-direction: column; gap: 18px\">\n<div>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 800\">Aha! gateway<\u002Fh3>\n<div style=\"margin-top: 8px; font-size: 44px; font-weight: 900; line-height: 1\">$5<span style=\"font-size: 20px; font-weight: 700\"> / month<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top: 6px; color: var(--muted); font-size: 16px\">per user<\u002Fdiv>\n<\u002Fdiv>\n<dl style=\"margin: 0; display: flex; flex-direction: column; gap: 14px; font-size: 16px\">\n<div><dt style=\"font-weight: 700\">You run<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">Only the agent, on your computer<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-weight: 700\">We provide<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">Gateway, notifications, app<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-weight: 700\">Messages<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">Unlimited<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-weight: 700\">Data<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">On your computer; the gateway relays ciphertext only<\u002Fdd><\u002Fdiv>\n<div><dt style=\"font-weight: 700\">Updates<\u002Fdt><dd style=\"margin: 2px 0 0; color: var(--muted)\">Gateway and app by Axxlabs; computer updates planned<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<a href=\"#install\" style=\"margin-top: auto; text-decoration: none; background: var(--accent); color: #1D1D1B; font-weight: 800; padding: 14px 20px; border-radius: 999px; text-align: center; min-height: 52px; box-sizing: border-box\">Use the hosted gateway<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 28px 0 0; text-align: center; color: var(--muted); font-size: 16px\">A flat fee for running the gateway and the app, not tied to usage.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" style=\"max-width: 1180px; margin: 0 auto; padding: 96px 24px\">\n<h2 style=\"margin: 0 0 40px; font-size: 44px; line-height: 1.1; font-weight: 900; letter-spacing: -0.5px\">FAQ<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; column-gap: 56px; row-gap: 32px\">\n<div style=\"flex: 1 1 440px; display: flex; flex-direction: column; gap: 32px\">\n<div><h3 style=\"margin: 0 0 6px; font-size: 20px; font-weight: 800\">What do I need?<\u002Fh3><p style=\"margin: 0; color: var(--muted)\">Linux, an NVIDIA GPU with 16 GB of VRAM (e.g. RTX 4080), 32 GB of RAM, 30 GB of disk. It must be on to answer.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 20px; font-weight: 800\">How capable is the model?<\u002Fh3><p style=\"margin: 0; color: var(--muted)\">Qwen3.6-35B-A3B (4-bit). Slower and weaker at complex reasoning than the largest hosted models.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 440px; display: flex; flex-direction: column; gap: 32px\">\n<div><h3 style=\"margin: 0 0 6px; font-size: 20px; font-weight: 800\">What happens when my computer is off?<\u002Fh3><p style=\"margin: 0; color: var(--muted)\">The app says so. Messages wait on the phone and are sent when it's back.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 20px; font-weight: 800\">Can it spend my money?<\u002Fh3><p style=\"margin: 0; color: var(--muted)\">Not yet: it has no payment tools, and typing into a website needs your approval.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 20px; font-weight: 800\">How do I get the app?<\u002Fh3><p style=\"margin: 0; color: var(--muted)\">Scan the QR code from your computer, then add it to your home screen.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 20px; font-weight: 800\">Who's behind it?<\u002Fh3><p style=\"margin: 0; color: var(--muted)\">Axxlabs, a one-person company in the UK: Felipe Lavratti. More at <a href=\"https:\u002F\u002Faxxlabs.ai\u002F\">axxlabs.ai<\u002Fa>.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FINAL CTA -->\n<section id=\"install\" style=\"max-width: 1180px; margin: 0 auto; padding: 0 24px 96px\">\n<div style=\"background: var(--accentSoft); border-radius: 28px; padding: 56px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 28px\">\n<div style=\"flex: 1 1 420px\">\n<h2 style=\"margin: 0; font-size: 40px; line-height: 1.1; font-weight: 900\">Install<\u002Fh2>\n<p style=\"margin: 12px 0 0; color: var(--muted)\">Instructions are in the aha-local-llm repository.<\u002Fp>\n<\u002Fdiv>\n<a href=\"https://github.com/axxlabs/aha-local-llm#install-with-a-coding-agent-easiest\" style=\"text-decoration: none; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 18px; padding: 16px 32px; border-radius: 999px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">Install<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"border-top: 1px solid var(--line)\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font-size: 15px; color: var(--muted)\">\n<span>Aha! is made by <a href=\"https://axxlabs.ai\" style=\"font-weight: 700\">Axxlabs Limited<\u002Fa>, a one-person company in the UK.<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n<a href=\"https://github.com/axxlabs\">Open source<\u002Fa>\n<a href=\"#promise\">Privacy<\u002Fa>\n<a href=\"https://axxlabs.ai\">Contact<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;hero&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Aha! Your private agent.&quot;,&quot;options&quot;:[&quot;Aha! Your private agent.&quot;,&quot;Your agent. Your computer. Your data.&quot;,&quot;The private agent: it runs at home, you chat from anywhere.&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:7400}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {\ntheme: this.props.dark ? 'dark' : 'light',\nheadline: this.props.hero ?? 'Aha! Your private agent.'\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
